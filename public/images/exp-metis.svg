<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="12"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="50" y1="0" x2="50" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="250" y1="0" x2="250" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="300" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="400" y2="50" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="400" y2="250" stroke="#6366f1" stroke-width="0.5"/>
  </g>

  <!-- Large hexagon background -->
  <path d="M200 60L280 106V198L200 244L120 198V106L200 60Z" stroke="url(#hexGrad)" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Medium hexagon -->
  <path d="M200 90L255 122V186L200 218L145 186V122L200 90Z" stroke="url(#hexGrad)" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Center hexagon filled -->
  <path d="M200 115L235 135V175L200 195L165 175V135L200 115Z" stroke="#6366f1" stroke-width="4" stroke-linejoin="round" fill="#6366f1" fill-opacity="0.15"/>

  <!-- AI brain nodes -->
  <circle cx="200" cy="155" r="8" fill="#6366f1"/>
  <circle cx="175" cy="140" r="4" fill="#8b5cf6"/>
  <circle cx="225" cy="140" r="4" fill="#8b5cf6"/>
  <circle cx="175" cy="170" r="4" fill="#8b5cf6"/>
  <circle cx="225" cy="170" r="4" fill="#8b5cf6"/>

  <!-- Connection lines -->
  <line x1="200" y1="155" x2="175" y2="140" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="155" x2="225" y2="140" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="155" x2="175" y2="170" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="155" x2="225" y2="170" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>

  <!-- Floating elements -->
  <rect x="60" y="80" width="30" height="20" rx="4" fill="#6366f1" opacity="0.2"/>
  <rect x="310" y="200" width="40" height="25" rx="4" fill="#8b5cf6" opacity="0.2"/>

  <!-- Code brackets -->
  <text x="75" y="95" font-family="monospace" font-size="14" fill="#6366f1" opacity="0.5">{}</text>
  <text x="320" y="218" font-family="monospace" font-size="14" fill="#8b5cf6" opacity="0.5">&lt;/&gt;</text>
</svg>
