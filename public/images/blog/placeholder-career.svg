<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111128"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.04"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Glow -->
  <circle cx="400" cy="170" r="130" fill="url(#glow)"/>
  <!-- Trophy -->
  <g transform="translate(340, 80)">
    <!-- Cup body -->
    <path d="M30 20 L30 100 Q30 140 60 150 Q90 140 90 100 L90 20 Z" fill="url(#gold)" opacity="0.85"/>
    <!-- Handles -->
    <path d="M30 40 Q0 40 0 70 Q0 100 30 100" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>
    <path d="M90 40 Q120 40 120 70 Q120 100 90 100" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>
    <!-- Shine -->
    <path d="M45 35 L45 90 Q45 120 60 128" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <!-- Base -->
    <rect x="40" y="150" width="40" height="10" rx="2" fill="rgba(251,191,36,0.5)"/>
    <rect x="30" y="160" width="60" height="8" rx="3" fill="rgba(251,191,36,0.4)"/>
    <!-- Star -->
    <polygon points="60,55 66,72 84,72 70,83 75,100 60,90 45,100 50,83 36,72 54,72" fill="rgba(255,255,255,0.25)"/>
  </g>
  <!-- Medal circles -->
  <circle cx="240" cy="200" r="25" fill="none" stroke="rgba(251,191,36,0.15)" stroke-width="2"/>
  <circle cx="560" cy="180" r="18" fill="none" stroke="rgba(251,191,36,0.12)" stroke-width="2"/>
  <circle cx="580" cy="260" r="30" fill="none" stroke="rgba(251,191,36,0.08)" stroke-width="2"/>
  <!-- 12x text -->
  <text x="240" y="208" font-family="system-ui, sans-serif" font-size="18" fill="rgba(251,191,36,0.25)" text-anchor="middle" font-weight="bold">12x</text>
  <!-- Sparkles -->
  <g fill="rgba(251,191,36,0.3)">
    <circle cx="300" cy="120" r="2"/>
    <circle cx="500" cy="100" r="2.5"/>
    <circle cx="280" cy="280" r="1.5"/>
    <circle cx="530" cy="290" r="2"/>
    <circle cx="350" cy="300" r="1.5"/>
    <circle cx="460" cy="110" r="1.5"/>
  </g>
  <!-- Label -->
  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="3">HACKATHONS</text>
</svg>
