<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111128"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Glow -->
  <circle cx="400" cy="180" r="130" fill="url(#glow)"/>
  <!-- Terminal window -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="400" height="260" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="400" height="32" rx="12" fill="rgba(255,255,255,0.04)"/>
    <rect x="0" y="20" width="400" height="12" fill="rgba(255,255,255,0.04)"/>
    <circle cx="18" cy="16" r="5" fill="#ef4444" opacity="0.6"/>
    <circle cx="36" cy="16" r="5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="54" cy="16" r="5" fill="#10b981" opacity="0.6"/>
    <!-- Code lines -->
    <g font-family="monospace" font-size="13">
      <text x="20" y="60" fill="rgba(16,185,129,0.7)">const</text>
      <text x="62" y="60" fill="rgba(255,255,255,0.5)"> ws = </text>
      <text x="104" y="60" fill="rgba(139,92,246,0.7)">new</text>
      <text x="134" y="60" fill="rgba(6,182,212,0.6)"> WebSocket</text>
      <text x="228" y="60" fill="rgba(255,255,255,0.3)">(url);</text>

      <text x="20" y="85" fill="rgba(16,185,129,0.7)">const</text>
      <text x="62" y="85" fill="rgba(255,255,255,0.5)"> stream = </text>
      <text x="140" y="85" fill="rgba(6,182,212,0.6)">StreamChat</text>
      <text x="228" y="85" fill="rgba(255,255,255,0.3)">();</text>

      <text x="20" y="110" fill="rgba(16,185,129,0.7)">const</text>
      <text x="62" y="110" fill="rgba(255,255,255,0.5)"> room = </text>
      <text x="130" y="110" fill="rgba(6,182,212,0.6)">Liveblocks</text>
      <text x="220" y="110" fill="rgba(255,255,255,0.3)">();</text>

      <text x="20" y="145" fill="rgba(255,255,255,0.15)">// Compare real-time approaches</text>

      <text x="20" y="175" fill="rgba(139,92,246,0.7)">function</text>
      <text x="88" y="175" fill="rgba(251,191,36,0.6)"> connect</text>
      <text x="155" y="175" fill="rgba(255,255,255,0.3)">() {</text>

      <text x="40" y="200" fill="rgba(16,185,129,0.7)">  await</text>
      <text x="92" y="200" fill="rgba(255,255,255,0.5)"> channel</text>
      <text x="156" y="200" fill="rgba(255,255,255,0.3)">.watch();</text>

      <text x="20" y="225" fill="rgba(255,255,255,0.3)">}</text>
    </g>
    <!-- Cursor blink -->
    <rect x="38" y="237" width="8" height="14" fill="rgba(16,185,129,0.5)"/>
  </g>
  <!-- Connection lines -->
  <g stroke="rgba(16,185,129,0.15)" stroke-width="1" stroke-dasharray="4,4">
    <line x1="620" y1="120" x2="700" y2="90"/>
    <line x1="620" y1="180" x2="700" y2="180"/>
    <line x1="620" y1="240" x2="700" y2="270"/>
  </g>
  <!-- Endpoint dots -->
  <circle cx="710" cy="90" r="6" fill="rgba(6,182,212,0.3)" stroke="rgba(6,182,212,0.5)" stroke-width="1"/>
  <circle cx="710" cy="180" r="6" fill="rgba(16,185,129,0.3)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
  <circle cx="710" cy="270" r="6" fill="rgba(139,92,246,0.3)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
  <!-- Label -->
  <text x="400" y="370" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="3">REAL-TIME</text>
</svg>
