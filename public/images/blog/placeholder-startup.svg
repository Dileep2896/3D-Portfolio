<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111128"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Glow circle -->
  <circle cx="400" cy="180" r="120" fill="url(#glow)"/>
  <!-- Rocket body -->
  <g transform="translate(370, 100)">
    <path d="M30 180 L30 120 Q30 60 60 30 Q90 60 90 120 L90 180 Z" fill="rgba(255,255,255,0.9)" stroke="none"/>
    <ellipse cx="60" cy="70" rx="12" ry="14" fill="url(#accent)"/>
    <!-- Fins -->
    <path d="M30 160 L10 190 L30 180 Z" fill="url(#accent)" opacity="0.8"/>
    <path d="M90 160 L110 190 L90 180 Z" fill="url(#accent)" opacity="0.8"/>
    <!-- Flame -->
    <path d="M40 180 Q50 210 60 230 Q70 210 80 180 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M48 180 Q55 200 60 215 Q65 200 72 180 Z" fill="#ef4444" opacity="0.6"/>
  </g>
  <!-- Chart bars -->
  <g transform="translate(520, 140)">
    <rect x="0" y="100" width="24" height="60" rx="4" fill="rgba(6,182,212,0.3)"/>
    <rect x="34" y="70" width="24" height="90" rx="4" fill="rgba(6,182,212,0.4)"/>
    <rect x="68" y="40" width="24" height="120" rx="4" fill="rgba(6,182,212,0.5)"/>
    <rect x="102" y="10" width="24" height="150" rx="4" fill="url(#accent)"/>
    <!-- Trend line -->
    <polyline points="12,95 46,65 80,35 114,5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="4,4"/>
  </g>
  <!-- Dollar signs -->
  <text x="240" y="170" font-family="monospace" font-size="28" fill="rgba(6,182,212,0.2)" font-weight="bold">$</text>
  <text x="200" y="240" font-family="monospace" font-size="20" fill="rgba(6,182,212,0.12)" font-weight="bold">$</text>
  <!-- Label -->
  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="3">STARTUP</text>
</svg>
