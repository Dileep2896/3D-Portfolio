<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111128"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Glow -->
  <circle cx="400" cy="180" r="140" fill="url(#glow)"/>
  <!-- Globe -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="80" ry="35" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="35" ry="80" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="1.5"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="rgba(139,92,246,0.15)" stroke-width="1"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="rgba(139,92,246,0.15)" stroke-width="1"/>
    <!-- India dot -->
    <circle cx="30" cy="15" r="5" fill="url(#accent1)" opacity="0.8"/>
    <circle cx="30" cy="15" r="10" fill="rgba(139,92,246,0.2)"/>
    <!-- US dot -->
    <circle cx="-45" cy="-20" r="5" fill="url(#accent2)" opacity="0.8"/>
    <circle cx="-45" cy="-20" r="10" fill="rgba(6,182,212,0.2)"/>
    <!-- Flight path -->
    <path d="M30,15 Q10,-50 -45,-20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="5,5"/>
    <!-- Airplane -->
    <g transform="translate(-10, -28) rotate(-30)">
      <polygon points="0,-4 12,0 0,4 2,0" fill="rgba(255,255,255,0.6)"/>
    </g>
  </g>
  <!-- Location labels -->
  <text x="480" y="210" font-family="system-ui, sans-serif" font-size="11" fill="rgba(139,92,246,0.4)">Bangalore</text>
  <text x="290" y="140" font-family="system-ui, sans-serif" font-size="11" fill="rgba(6,182,212,0.4)">Rochester, NY</text>
  <!-- Label -->
  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="3">JOURNEY</text>
</svg>
